apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transpose-cv
  namespace: transpose-cv
  labels:
    app.kubernetes.io/name: transpose-cv
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - transpose-cv.sent-tech.ca
        - cv.sent-tech.ca
        - scalian-cv.sent-tech.ca
      secretName: transpose-cv-tls
  rules:
    - host: transpose-cv.sent-tech.ca
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: transpose-cv-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transpose-cv-ui
                port:
                  name: http
    # Canonical domain, repointed from the decommissioned SCW/GitHub-Pages setup to OVH.
    - host: cv.sent-tech.ca
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: transpose-cv-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transpose-cv-ui
                port:
                  name: http
    # Legacy native tenant host: all paths go to the API, whose app.ts issues a
    # 301 redirect to https://cv.sent-tech.ca/scalian/... (legacyTenantHosts).
    - host: scalian-cv.sent-tech.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transpose-cv-api
                port:
                  name: http
